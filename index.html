<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;padding:16px;background:#f5f5f5;margin:0}
  .card{background:#fff;border-radius:10px;padding:16px;max-width:420px;margin:auto;box-shadow:0 2px 8px #0002}
  h3{margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  td{padding:10px;border-bottom:1px solid #eee}
  td:first-child{font-weight:bold;color:#555;width:40%}
</style>
</head>
<body>
<div class="card">
  <h3>Product Details</h3>
  <table id="t"></table>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const rows = [["Item","item"],["Colour","colour"],["Size","size"],["GSM","gsm"],["Type","type"],["Price (Rs)","rs"],["Price ($)","usd"]];
  const t = document.getElementById("t");
  rows.forEach(([label, key]) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td");
    const b = document.createElement("td");
    a.textContent = label;
    b.textContent = p.get(key) || "-";
    tr.append(a, b);
    t.appendChild(tr);
  });
</script>
</body>
</html>
